name: stock-alert

on:
  schedule:
    # 미국 정규장(서머타임/표준시 모두 포함) 월~금, 30분 간격. 시간은 UTC 기준.
    # 장 시간 여부는 alert.py가 뉴욕 시간으로 다시 확인합니다.
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 (장 시간과 무관하게 실행)

permissions:
  contents: write         # 중복 알림 방지용 state.json 저장

concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check signals
        run: python alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state.json meta.json 2>/dev/null || git add state.json
          git diff --cached --quiet || (git commit -m "chore: update alert state" && git push)
