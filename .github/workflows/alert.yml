name: stock-alert

on:
  schedule:
    # G전략 리포트: 뉴욕 15:40 (장 마감 20분 전). 서머타임/표준시 대비 두 번 예약,
    # g_alert.py가 뉴욕 시간 15:30~16:30 + 하루 1회만 실제 실행합니다. (UTC 기준)
    - cron: "40 19,20 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 (장 시간과 무관하게 실행)

permissions:
  contents: write         # 중복 알림 방지용 state.json 저장

concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: G strategy report
        run: python g_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state_g.json meta.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: update alert state" && git push)
