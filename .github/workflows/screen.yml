name: rsi-screen

on:
  schedule:
    # 장 마감 후(뉴욕 16:40). 서머타임/표준시 대비 두 번 예약, 스크립트가 하루 1회만 실행. (UTC 기준)
    - cron: "40 20,21 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 (시간 무관)

permissions:
  contents: write

concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        run: python screen_rsi.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state_screen.json meta.json results/screen 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: rsi screen results" && git pull --rebase && git push)
