name: backtest

on:
  workflow_dispatch: {}   # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: stock-alert      # 알림 작업과 동시에 커밋하지 않도록
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - run: python portfolio.py
      - run: python sp500_portfolio.py
      - run: python backtest_ma5_20.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || (git commit -m "chore: backtest results" && git pull --rebase && git push)
